# تشغيل ترتيل على خادم VPS واحد: التطبيق + MySQL 8 + Caddy (HTTPS تلقائي).
#   cp .env.example .env   # ثم املأ القيم
#   docker compose up -d --build
services:
  # يطبق ترحيلات قاعدة البيانات مرة عند كل تشغيل ثم يخرج؛ التطبيق لا يبدأ إلا بعد نجاحه.
  migrate:
    build: .
    image: tarteel-app
    env_file: .env
    environment:
      DATABASE_URL: mysql://tarteel:${MYSQL_PASSWORD}@db:3306/tarteel
    command: ["node", "dist/migrate.js"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    image: tarteel-app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: mysql://tarteel:${MYSQL_PASSWORD}@db:3306/tarteel
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: tarteel
      MYSQL_USER: tarteel
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      retries: 10

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on: [app]

volumes:
  uploads:
  mysql:
  caddy:
