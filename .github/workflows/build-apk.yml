name: Build Tarteel Android wrapper

on:
  workflow_dispatch:
  push:
    paths:
      - "android-wrapper/**"

permissions:
  contents: read

defaults:
  run:
    working-directory: android-wrapper

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android-wrapper/package-lock.json

      - name: Install wrapper dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: android-wrapper/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tarteel-android-wrapper-debug
          path: android-wrapper/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
