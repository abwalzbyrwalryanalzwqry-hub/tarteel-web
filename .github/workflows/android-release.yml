name: Release Tarteel Android (Google Play)

# بناء AAB موقّع بمفتاح الرفع الدائم للنشر على Google Play، وAPK موقّعة لكل معمارية للتوزيع المباشر.
# الأسرار المطلوبة: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "اسم الإصدار (مثل 0.2.0)"
        required: true
        default: "0.1.0"
  push:
    tags: ["android-v*"]

permissions:
  contents: read

defaults:
  run:
    working-directory: mobile-android

env:
  ORG_GRADLE_PROJECT_reactNativeArchitectures: armeabi-v7a,arm64-v8a
  # عنوان منصة ترتيل الافتراضي داخل التطبيق (متغير مستودع: Settings ← Variables ← TARTEEL_SERVER_URL)
  TARTEEL_SERVER_URL: ${{ vars.TARTEEL_SERVER_URL }}
  # رقم متزايد تلقائياً؛ Google Play يرفض تكرار versionCode.
  ANDROID_VERSION_CODE: ${{ github.run_number }}
  ANDROID_VERSION_NAME: ${{ inputs.version_name || github.ref_name }}

jobs:
  signed-release:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        working-directory: .
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/boost \
            /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL /usr/local/share/powershell \
            /usr/local/share/chromium /opt/microsoft || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize version name
        run: echo "ANDROID_VERSION_NAME=${ANDROID_VERSION_NAME#android-v}" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: mobile-android/pnpm-lock.yaml

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck and tests
        run: |
          ./node_modules/.bin/tsc --noEmit
          ./node_modules/.bin/vitest run --config vitest.config.ts

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Restore upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::السر ANDROID_KEYSTORE_BASE64 غير مضبوط"; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tarteel-upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/tarteel-upload.jks" >> "$GITHUB_ENV"

      - name: Build signed AAB (Google Play)
        working-directory: mobile-android/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease --no-daemon

      - name: Build signed APK per ABI (direct distribution)
        working-directory: mobile-android/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/apks"
          for abi in arm64-v8a armeabi-v7a; do
            ./gradlew :app:assembleRelease --no-daemon -PreactNativeArchitectures=$abi
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/apks/tarteel-${ANDROID_VERSION_NAME}-${abi}.apk"
          done

      - name: Verify signatures
        working-directory: mobile-android/android
        run: |
          BT="$ANDROID_HOME/build-tools/36.0.0"
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab | tail -1
          for f in "$RUNNER_TEMP"/apks/*.apk; do "$BT/apksigner" verify --print-certs "$f" | head -2; done

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tarteel-android-${{ env.ANDROID_VERSION_NAME }}-${{ github.run_number }}
          if-no-files-found: error
          path: |
            mobile-android/android/app/build/outputs/bundle/release/app-release.aab
            mobile-android/android/app/build/outputs/mapping/release/mapping.txt
            ${{ runner.temp }}/apks/*.apk

      - name: Remove keystore
        if: always()
        working-directory: .
        run: rm -f "$RUNNER_TEMP/tarteel-upload.jks"
