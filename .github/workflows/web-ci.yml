name: فحص نسخة الويب

# نسخة الويب (client + server + shared) بلا أي فحص آلي حتى الآن؛ اختبار فاشل أو
# خطأ أنواع يصل إلى main دون أن يلاحظه أحد. هذا الملف يشغّل فحص الأنواع
# واختبارات الخادم والبناء مع كل دفع إلى main ومع كل طلب دمج.

on:
  push:
    branches: [main]
    paths-ignore:
      - "mobile-android/**"
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "mobile-android/**"
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:
  # فحص أسبوعي للثغرات الجديدة حتى دون تغيير في الكود (الإثنين 06:00 بتوقيت صنعاء).
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: الأنواع والاختبارات والبناء
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # قاعدة MySQL حقيقية لاختبارات التكامل (server/integration) وللتأكد أن الترحيلات تُطبَّق من الصفر.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tarteel_test
          MYSQL_USER: tarteel
          MYSQL_PASSWORD: tarteel
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      TEST_DATABASE_URL: mysql://tarteel:tarteel@127.0.0.1:3306/tarteel_test
    steps:
      - uses: actions/checkout@v7

      # النسخة تُقرأ من packageManager في package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: تثبيت الحزم
        run: pnpm install --frozen-lockfile

      # يفشل عند أي ثغرة عالية أو حرجة في اعتماديات الإنتاج.
      - name: فحص ثغرات الاعتماديات
        run: pnpm audit --prod --audit-level=high

      - name: فحص الأنواع
        run: pnpm check

      - name: تطبيق الترحيلات على قاعدة الاختبار
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: pnpm exec drizzle-kit migrate

      # يجب ألا يولّد المخطط ترحيلاً جديداً؛ وإلا فقد عُدّل schema.ts دون ترحيل.
      - name: لا فرق بين المخطط والترحيلات
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          pnpm exec drizzle-kit generate --name ci_drift_check
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::schema.ts يختلف عن الترحيلات؛ شغّل drizzle-kit generate وأضف الترحيل."
            git status --porcelain drizzle
            exit 1
          fi

      - name: الاختبارات (مع اختبارات التكامل على MySQL)
        run: pnpm test

      - name: البناء
        run: pnpm build
