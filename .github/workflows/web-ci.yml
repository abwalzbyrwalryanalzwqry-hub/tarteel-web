name: فحص نسخة الويب

# نسخة الويب (client + server + shared) بلا أي فحص آلي حتى الآن؛ اختبار فاشل أو
# خطأ أنواع يصل إلى main دون أن يلاحظه أحد. هذا الملف يشغّل فحص الأنواع
# واختبارات الخادم والبناء مع كل دفع إلى main ومع كل طلب دمج.

on:
  push:
    branches: [main]
    paths-ignore:
      - "mobile-android/**"
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "mobile-android/**"
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:
  # فحص أسبوعي للثغرات الجديدة حتى دون تغيير في الكود (الإثنين 06:00 بتوقيت صنعاء).
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: الأنواع والاختبارات والبناء
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # يلزم تاريخ الفرع لمقارنة الملفات الجديدة بالفرع الأساسي في فحص التنسيق.
          fetch-depth: 0

      # النسخة تُقرأ من packageManager في package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: تثبيت الحزم
        run: pnpm install --frozen-lockfile

      # يفشل عند أي ثغرة عالية أو حرجة في اعتماديات الإنتاج.
      - name: فحص ثغرات الاعتماديات
        run: pnpm audit --prod --audit-level=high

      - name: فحص الأنواع
        run: pnpm check

      - name: فحص الشيفرة (ESLint)
        run: pnpm lint

      # معظم الملفات القديمة غير منسقة؛ إعادة تنسيقها دفعة واحدة تتعارض مع كل فرع مفتوح.
      # لذلك نشترط Prettier على الملفات الجديدة فقط، وتُنسَّق القديمة تدريجياً.
      - name: تنسيق الملفات الجديدة (Prettier)
        if: github.event_name == 'pull_request'
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=A "origin/${{ github.base_ref }}...HEAD" -- '*.ts' '*.tsx' '*.js' '*.mjs' '*.css')
          if [ ${#files[@]} -eq 0 ]; then echo "لا ملفات جديدة"; exit 0; fi
          pnpm exec prettier --check --ignore-unknown "${files[@]}"

      - name: الاختبارات
        run: pnpm test

      - name: البناء
        run: pnpm build
