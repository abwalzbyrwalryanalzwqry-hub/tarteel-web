name: Build Tarteel native Android

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile-android/**"
      - ".github/workflows/android-native.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: mobile-android

env:
  # الهواتف الحقيقية فقط؛ x86/x86_64 للمحاكيات وتضاعف حجم البناء الأصلي (C++)
  # وكانت سبب نفاد مساحة القرص في خادم GitHub عند بناء نسخة الإصدار.
  ORG_GRADLE_PROJECT_reactNativeArchitectures: armeabi-v7a,arm64-v8a
  # عنوان منصة ترتيل الافتراضي داخل التطبيق (متغير مستودع: Settings ← Variables ← TARTEEL_SERVER_URL)
  TARTEEL_SERVER_URL: ${{ vars.TARTEEL_SERVER_URL }}

jobs:
  verify-and-build-debug:
    runs-on: ubuntu-latest
    steps:
      # خادم GitHub يبدأ بنحو 14GB متاحة فقط؛ بناء React Native لأربعة متغيرات يتجاوزها.
      - name: Free disk space
        working-directory: .
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet \
            /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/boost \
            /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell /usr/local/share/chromium /opt/microsoft || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: mobile-android/pnpm-lock.yaml

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: ./node_modules/.bin/tsc --noEmit

      - name: Sync tests
        run: ./node_modules/.bin/vitest run --config vitest.config.ts

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # الحزمة الافتراضية «tools» أُزيلت من مستودع Google فيفشل sdkmanager بها.
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      # مفتاح Debug مستبعد من git (.gitignore) كما ينبغي؛ نولّده في كل تشغيل
      # بالقيم القياسية التي يتوقعها build.gradle. الإصدار الموقّع لا يتأثر.
      - name: Create debug keystore
        working-directory: mobile-android/android/app
        run: |
          test -f debug.keystore || keytool -genkeypair -v -keystore debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK and AAB
        working-directory: mobile-android/android
        run: ./gradlew :app:assembleDebug :app:bundleDebug --no-daemon

      - name: Upload debug artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tarteel-native-android-debug-${{ github.sha }}
          if-no-files-found: error
          path: |
            mobile-android/android/app/build/outputs/apk/debug/app-debug.apk
            mobile-android/android/app/build/outputs/bundle/debug/app-debug.aab

      # حذف مخرجات Debug الوسيطة (C++ وdex) قبل الإصدار لاسترداد المساحة.
      - name: Clean debug intermediates
        run: |
          rm -rf android/app/build/intermediates android/app/build/tmp android/app/.cxx
          find node_modules/.pnpm -path '*/android/build' -type d -prune -exec rm -rf {} + 2>/dev/null || true
          find node_modules/.pnpm -path '*/android/.cxx' -type d -prune -exec rm -rf {} + 2>/dev/null || true
          df -h /

      - name: Build unsigned release APK and AAB
        working-directory: mobile-android/android
        run: ./gradlew :app:assembleReleaseUnsigned :app:bundleReleaseUnsigned --no-daemon

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tarteel-native-android-release-unsigned-${{ github.sha }}
          if-no-files-found: error
          path: |
            mobile-android/android/app/build/outputs/apk/releaseUnsigned/app-releaseUnsigned.apk
            mobile-android/android/app/build/outputs/bundle/releaseUnsigned/app-releaseUnsigned.aab
